# Prometheus for the local Relay stack (deploy/compose/docker-compose.yml).
# Relay runs on the host (make run / make serve), so it is reached via
# host.docker.internal; the inference engines run in Compose.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: relay
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # llama.cpp's own metrics (started with --metrics): engine queue depth, tokens/s.
  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["llamacpp:8080"]
        labels: { backend: "llamacpp-cpu" }
      - targets: ["llamacpp-gpu:8080"] # only up with `make up-gpu`
        labels: { backend: "llamacpp-gpu" }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
