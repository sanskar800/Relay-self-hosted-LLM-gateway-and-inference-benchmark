# Relay config for benchmark runs on the local RTX 4050 (ADR-001). Use with:
#   RELAY_CONFIG=config/bench/local-gpu.yaml make run
# One backend per model and NO fallback: a failing backend must show up as errors, not be
# hidden behind another machine. No retries: a retry resends the request, so the engine
# would see more load than the benchmark offered.

backends:
  llamacpp-gpu:
    engine: llamacpp
    url: http://127.0.0.1:8082
    first_token_timeout_s: 120   # queueing past saturation is measured, not cut short

retry:
  max_attempts: 1

models:
  # Only one is served at a time (LLAMACPP_GPU_MODEL / LLAMACPP_GPU_ALIAS select it).
  qwen2.5-1.5b-instruct:
    backends: [llamacpp-gpu]
  qwen2.5-7b-instruct:
    backends: [llamacpp-gpu]
