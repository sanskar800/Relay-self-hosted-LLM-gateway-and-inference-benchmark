# Relay model routing. Loaded and validated at startup (RELAY_CONFIG overrides the path).
#
# backends: the inference servers Relay can call.
# models:   public model names clients may request, each mapped to backends in order
#           of preference. Relay uses the first one; fallback down the list comes later.
#
# Each backend must serve the model under its PUBLIC name (llama.cpp --alias,
# vLLM --served-model-name), so Relay never has to rewrite the request body.

backends:
  llamacpp-cpu:
    engine: llamacpp
    url: http://127.0.0.1:8081
  llamacpp-gpu:            # opt-in: `make up-gpu`
    engine: llamacpp
    url: http://127.0.0.1:8082

# Optional per backend: connect_timeout_s (5), first_token_timeout_s (60),
# idle_timeout_s (30), total_timeout_s (300).

# Retries before the first token only (ADR-003). Defaults shown.
retry:
  max_attempts: 3       # including the first try
  base_delay_s: 0.1     # backoff ceiling doubles per retry, with full jitter
  max_delay_s: 1.0

# Circuit breaker per backend: after `failure_threshold` consecutive failures the
# backend is skipped for `open_duration_s`, then one probe request tests it.
breaker:
  failure_threshold: 3
  open_duration_s: 10

limits:
  max_body_bytes: 1048576   # 1 MB; larger bodies get 413 without being read into memory
  max_messages: 256
  max_tokens: 4096          # ceiling when the client sends max_tokens / max_completion_tokens

models:
  qwen2.5-1.5b-instruct:
    # Order = preference; the router falls back down the list. CPU first by default
    # because the GPU service is opt-in (`make up-gpu`); with it running, put
    # llamacpp-gpu first. (An absent first backend costs one probe per cool-down.)
    backends: [llamacpp-cpu, llamacpp-gpu]
