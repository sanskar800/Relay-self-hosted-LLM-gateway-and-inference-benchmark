# Local Relay stack. Run from the repo root:
#   docker compose -f deploy/compose/docker-compose.yml up -d     (or: make up)
name: relay

# Settings shared by every llama.cpp service.
x-llamacpp-common: &llamacpp-common
  volumes:
    # Models live outside the repo (scripts/download_models.py); mounted read-only.
    - ${RELAY_MODELS_DIR:-~/models}:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s
  restart: unless-stopped

services:
  # llama.cpp OpenAI-compatible server on CPU. Also the fallback backend later.
  llamacpp:
    <<: *llamacpp-common
    # Pinned build (version 0.6.0-dev, build 11459, commit f498f864f); engine version affects benchmarks.
    image: ghcr.io/ggml-org/llama.cpp:server-b11459
    ports:
      # Loopback only: llama.cpp has no auth, so clients must go through Relay.
      - "127.0.0.1:8081:8080"
    command:
      - --model
      - /models/${LLAMACPP_MODEL:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      # Name reported in responses and /v1/models; Relay's public model name maps to it.
      - --alias
      - ${LLAMACPP_ALIAS:-qwen2.5-1.5b-instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # Total context shared by parallel slots: 2 slots x 4096 tokens each by default.
      # Slots cap how many requests run at once (the rest queue); benchmarks set these
      # explicitly (ADR-001): LLAMACPP_PARALLEL=4 LLAMACPP_CTX=4096.
      - --ctx-size
      - "${LLAMACPP_CTX:-8192}"
      - --parallel
      - "${LLAMACPP_PARALLEL:-2}"
      # Host-RAM prompt cache, engine default 8192 MiB: on a 16 GB laptop it can push the
      # host into paging (docs/findings.md F9). Benchmarks disable it (LLAMACPP_CACHE_RAM=0).
      - --cache-ram
      - "${LLAMACPP_CACHE_RAM:-8192}"
      # Prometheus-format engine metrics on /metrics (queue depth, tokens/s).
      - --metrics

  # Same build with CUDA, on the RTX 4050. Opt-in: `make up-gpu` (CI has no GPU).
  # Needs an NVIDIA driver supporting CUDA >= 12.8 (see docs/development.md).
  llamacpp-gpu:
    <<: *llamacpp-common
    profiles: [gpu]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11459
    ports:
      # Loopback only: llama.cpp has no auth, so clients must go through Relay.
      - "127.0.0.1:8082:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - /models/${LLAMACPP_GPU_MODEL:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      - --alias
      - ${LLAMACPP_GPU_ALIAS:-qwen2.5-1.5b-instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${LLAMACPP_GPU_CTX:-8192}"
      - --parallel
      - "${LLAMACPP_GPU_PARALLEL:-2}"
      # Offload all layers to the GPU (99 > the model's layer count).
      - --n-gpu-layers
      - "99"
      - --cache-ram
      - "${LLAMACPP_CACHE_RAM:-8192}"
      - --metrics

  # Durable store: tenants, API keys (hashed) and the usage ledger.
  postgres:
    image: postgres:18.6-alpine
    environment:
      # Local development credentials only; the port is bound to loopback.
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      # 5433 on the host: 5432 may already be taken by a natively installed PostgreSQL.
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (versioned subdirectory).
      - pgdata:/var/lib/postgresql
      # Runs only when the data volume is empty. After schema edits: `make db-reset`.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Shared rate-limit counters. Short-lived by design, so no persistence.
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Scrapes Relay (on the host) and llama.cpp; evaluates the alert rules.
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle # POST /-/reload after editing the config
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus
    extra_hosts:
      # Docker Desktop provides this name; on Linux this line adds it.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Dashboards provisioned from the repo (monitoring/grafana).
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      # Local development only: admin/admin, and read-only anonymous viewing.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/relay.json
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # 3001 on the host: 3000 is often taken by other local dev servers.
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Relay itself as a container. Opt-in (`make up-all`): in development Relay usually
  # runs on the host (`make run`) for fast reloads.
  relay:
    profiles: [app]
    build:
      context: ../..
    environment:
      RELAY_CONFIG: config/relay.docker.yaml
      RELAY_DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
      RELAY_REDIS_URL: redis://redis:6379/0
      RELAY_OTEL_ENDPOINT: http://jaeger:4318
    ports:
      # Also what Prometheus scrapes (host.docker.internal:8000).
      - "127.0.0.1:${RELAY_HOST_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      llamacpp: { condition: service_healthy }
    # docker stop sends SIGTERM: 5 s not-ready grace + up to 30 s drain before SIGKILL.
    stop_grace_period: 40s
    restart: unless-stopped

  # Traces: receives OTLP from Relay (RELAY_OTEL_ENDPOINT), UI on :16686. In-memory.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318" # OTLP over HTTP
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
