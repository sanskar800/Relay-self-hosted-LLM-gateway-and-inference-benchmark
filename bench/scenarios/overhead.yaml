# Gateway overhead: run by `python -m bench.overhead`, which serves a fake engine with
# FIXED latency and starts its own Relay on 127.0.0.1:8010 pointed at it. The same
# requests (same seed) go direct to the engine and via Relay; the difference is Relay.
# target.base_url is the Relay path; the tool derives the direct path from it.

name: overhead
description: "Same open-loop load direct to a fixed-latency fake engine and via Relay."

target:
  base_url: http://127.0.0.1:8010/v1
  model: qwen2.5-1.5b-instruct  # a model the dev tenant may use; served by the fake engine
  api_key_env: RELAY_TEST_API_KEY

load:
  mode: open
  arrival_rates_rps: [5]  # dev tenant allows 10 req/s: no 429s to distort the comparison
  duration_s: 30
  warmup_s: 5
  request_timeout_s: 30

workload:
  seed: 42
  prompt_tokens: { distribution: lognormal, median: 120, sigma: 0.5, min: 16, max: 600 }
  output_tokens: { distribution: lognormal, median: 48, sigma: 0.4, min: 8, max: 128 }
  ignore_eos: true
  unique_prefix: true

slo:
  ttft_s: 1.0
  tpot_s: 0.1
