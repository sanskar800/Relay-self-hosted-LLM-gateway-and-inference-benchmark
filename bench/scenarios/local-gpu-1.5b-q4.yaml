# Benchmark (ADR-001): llama.cpp on the RTX 4050, Qwen2.5-1.5B Q4_K_M, through Relay.
#
#   LLAMACPP_GPU_PARALLEL=4 LLAMACPP_GPU_CTX=4096 make up-gpu
#   RELAY_CONFIG=config/bench/local-gpu.yaml make run
#   make bench SCENARIO=bench/scenarios/local-gpu-1.5b-q4.yaml ARGS=--probe   # choose rates
#   make bench SCENARIO=bench/scenarios/local-gpu-1.5b-q4.yaml
#
# The workload and SLO are identical in every benchmark scenario (tests check this).

name: local-gpu-1.5b-q4
description: "llama.cpp CUDA on the RTX 4050, Qwen2.5-1.5B-Instruct Q4_K_M, open loop via Relay."

setup:
  hardware: "RTX 4050 Laptop GPU 6 GB (i7-14650HX, 16 GB RAM)"
  engine: "llama.cpp b11459 (server-cuda12)"
  model_file: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
  quantization: "Q4_K_M"
  server_args: "--parallel 4 --ctx-size 4096 --n-gpu-layers 99"
  backend: llamacpp-gpu

target:
  base_url: http://127.0.0.1:8000/v1
  model: qwen2.5-1.5b-instruct
  api_key_env: RELAY_BENCH_API_KEY

load:
  mode: open
  arrival_rates_rps: [1.0]  # placeholder: set from the probe before the real run
  duration_s: 120
  warmup_s: 20
  request_timeout_s: 180

workload:
  seed: 42
  prompt_tokens: { distribution: lognormal, median: 200, sigma: 0.6, min: 16, max: 600 }
  output_tokens: { distribution: lognormal, median: 96, sigma: 0.5, min: 16, max: 256 }
  ignore_eos: true
  unique_prefix: true

slo: # docs/brief.md
  ttft_s: 1.0
  tpot_s: 0.1
