# Benchmark (ADR-001): CPU baseline, llama.cpp on the i7-14650HX, Qwen2.5-1.5B Q4_K_M,
# through Relay. The reference the GPU configurations are compared with.
#
#   make bench-stack-cpu
#   RELAY_CONFIG=config/bench/local-cpu.yaml make run
#   make bench SCENARIO=bench/scenarios/local-cpu-1.5b-q4.yaml ARGS=--probe   # choose rates
#   make bench SCENARIO=bench/scenarios/local-cpu-1.5b-q4.yaml
#
# The harness runs on the same CPU, so it competes with the engine; its own cost is small
# (findings F3) but is part of this configuration's numbers.
# The workload and SLO are identical in every benchmark scenario (tests check this).

name: local-cpu-1.5b-q4
description: "llama.cpp on the laptop CPU (no GPU), Qwen2.5-1.5B-Instruct Q4_K_M, open loop via Relay."

setup:
  hardware: "Intel i7-14650HX (16 cores / 24 threads), 16 GB RAM; no GPU"
  engine: "llama.cpp b11459 (server, CPU)"
  model_file: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
  quantization: "Q4_K_M"
  server_args: "--parallel 4 --ctx-size 4096 --cache-ram 0"
  backend: llamacpp-cpu

target:
  base_url: http://127.0.0.1:8000/v1
  model: qwen2.5-1.5b-instruct
  api_key_env: RELAY_BENCH_API_KEY

load:
  mode: open
  arrival_rates_rps: [0.2]  # placeholder: set from the probe before the real run
  duration_s: 120
  warmup_s: 20
  request_timeout_s: 180

workload:
  seed: 42
  prompt_tokens: { distribution: lognormal, median: 200, sigma: 0.6, min: 16, max: 600 }
  output_tokens: { distribution: lognormal, median: 96, sigma: 0.5, min: 16, max: 256 }
  ignore_eos: true
  unique_prefix: true

slo: # docs/brief.md
  ttft_s: 1.0
  tpot_s: 0.1
