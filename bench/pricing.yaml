# GPU prices for the cost model: £ per 1M output tokens =
#   price per hour / (measured output tokens per second x 3600) x 1,000,000
#
# These are ASSUMPTIONS (public list prices), not bills: every cost derived from them is
# labelled an estimate. Each entry records where the price came from and when.
# null = no comparable public price: cost is reported as TBD, never guessed.

